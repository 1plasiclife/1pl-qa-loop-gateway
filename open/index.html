<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Open in LOOP · 1 Plastic Life</title>
  <meta name="robots" content="noindex" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:2rem;background:#0b1f14;color:#f4f7f5}
    a{color:#7dcea0} .card{max-width:28rem;margin:2rem auto;padding:1.25rem 1.5rem;background:#122a1c;border-radius:12px}
    code{font-size:.85rem;word-break:break-all} .muted{opacity:.75;font-size:.9rem}
  </style>
</head>
<body>
  <div class="card">
    <h1 style="font-size:1.15rem;margin:0 0 .5rem">Open in LOOP</h1>
    <p class="muted" id="status">Opening your task…</p>
    <p class="muted">If nothing happens, tap the link below.</p>
    <p><a id="fallback" href="#">Continue to LOOP</a></p>
    <p class="muted">Branded door only — Apps Script backend unchanged. No publish from this page.</p>
  </div>
  <script>
(function () {
  var QA = 'https://script.google.com/macros/s/AKfycbybnSTiCkJiTOrSQyAT2QDKpeUJPqtY1wdgIAk9nunFCS0eS3gy5Q-Ah582FqtDQnCw9A/exec';
  var PROD = 'https://script.google.com/macros/s/AKfycbzbHiSf0paceH7Rdgt2Fe05joeS_8nn63sLT7HYFdPkWV88ZIE3BXT2tIFUeE112nJ69Q/exec';
  var q = new URLSearchParams(location.search);
  var task = String(q.get('task') || '').trim().toUpperCase();
  var env = String(q.get('env') || 'qa').toLowerCase();
  var base = (env === 'prod' || env === 'production') ? PROD : QA;
  var status = document.getElementById('status');
  var fallback = document.getElementById('fallback');
  if (!/^TSK-\d+$/.test(task)) {
    status.textContent = 'Add a LOOP task id: ?task=TSK-1234 (optional &env=qa|prod).';
    fallback.href = base + '?view=open&skip_canonical_redirect=1';
    fallback.textContent = 'Open LOOP Tasks (no task id)';
    return;
  }
  var url = base + '?view=open&task=' + encodeURIComponent(task) + '&skip_canonical_redirect=1';
  fallback.href = url;
  fallback.textContent = url;
  status.textContent = 'Opening ' + task + ' on ' + (base === PROD ? 'Production' : 'QA') + '…';
  location.replace(url);
})();
  </script>
</body>
</html>
